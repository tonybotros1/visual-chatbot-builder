services:
  frontend:
    build:
      context: ./frontend
    command: npm run dev -- --hostname 0.0.0.0
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      # Keep the container's Next.js build cache separate from a host `npm run dev`;
      # sharing one .next directory corrupts the Turbopack cache.
      - frontend_next:/app/.next
    depends_on:
      backend:
        condition: service_started

  admin:
    build:
      context: ./admin
    command: npm run dev -- --hostname 0.0.0.0 --port 3100
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    ports:
      - "3100:3100"
    volumes:
      - ./admin:/app
      - admin_node_modules:/app/node_modules
      - admin_next:/app/.next
    depends_on:
      backend:
        condition: service_started

  backend:
    build:
      context: ./backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://visual_chatbot:visual_chatbot_dev@postgres:5432/visual_chatbot}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000", "http://127.0.0.1:3000", "http://localhost:3100", "http://127.0.0.1:3100"]}
      SECRET_KEY: ${SECRET_KEY:-replace-this-development-secret-before-production}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-720}
      UPLOAD_DIRECTORY: ${UPLOAD_DIRECTORY:-data/uploads}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-25}
      PUBLIC_RATE_LIMIT_PER_MINUTE: ${PUBLIC_RATE_LIMIT_PER_MINUTE:-120}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-}
      SUPER_ADMIN_NAME: ${SUPER_ADMIN_NAME:-Platform admin}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    # Healthy only once migrations have run and the API answers, so dependants
    # such as the delivery worker never query tables that do not exist yet.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  integration-worker:
    build:
      context: ./backend
    command: python -m app.workers.delivery_worker
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://visual_chatbot:visual_chatbot_dev@postgres:5432/visual_chatbot}
      SECRET_KEY: ${SECRET_KEY:-replace-this-development-secret-before-production}
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_healthy

  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-visual_chatbot}
      POSTGRES_USER: ${POSTGRES_USER:-visual_chatbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-visual_chatbot_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-visual_chatbot} -d ${POSTGRES_DB:-visual_chatbot}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  frontend_node_modules:
  frontend_next:
  admin_node_modules:
  admin_next:
  postgres_data:
