services:
  frontend:
    build:
      context: ./frontend
    command: npm run dev -- --hostname 0.0.0.0
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_started

  backend:
    build:
      context: ./backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://visual_chatbot:visual_chatbot_dev@postgres:5432/visual_chatbot}
      CORS_ORIGINS: '["http://localhost:3000", "http://127.0.0.1:3000"]'
      SECRET_KEY: ${SECRET_KEY:-replace-this-development-secret-before-production}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-720}
      UPLOAD_DIRECTORY: ${UPLOAD_DIRECTORY:-data/uploads}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-25}
      PUBLIC_RATE_LIMIT_PER_MINUTE: ${PUBLIC_RATE_LIMIT_PER_MINUTE:-120}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy

  integration-worker:
    build:
      context: ./backend
    command: python -m app.workers.delivery_worker
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://visual_chatbot:visual_chatbot_dev@postgres:5432/visual_chatbot}
      SECRET_KEY: ${SECRET_KEY:-replace-this-development-secret-before-production}
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_started

  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-visual_chatbot}
      POSTGRES_USER: ${POSTGRES_USER:-visual_chatbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-visual_chatbot_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-visual_chatbot} -d ${POSTGRES_DB:-visual_chatbot}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  frontend_node_modules:
  postgres_data:
