name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: visual_chatbot
          POSTGRES_USER: visual_chatbot
          POSTGRES_PASSWORD: visual_chatbot_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U visual_chatbot -d visual_chatbot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://visual_chatbot:visual_chatbot_ci@localhost:5432/visual_chatbot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            backend/constraints.txt
      - run: pip install -r requirements-dev.txt -c constraints.txt
      - run: python -m pytest -q
      - name: Apply all migrations to an empty database
        run: alembic upgrade head

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  admin:
    name: Admin console typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  smoke:
    name: End-to-end API smoke suite
    runs-on: ubuntu-latest
    needs: [backend, frontend, admin]
    env:
      SUPER_ADMIN_EMAIL: ci-admin@example.com
      SUPER_ADMIN_PASSWORD: ci-admin-password-not-secret
    steps:
      - uses: actions/checkout@v4
      - name: Start the Compose stack
        run: docker compose up -d --build
      - name: Wait for API and frontend
        run: |
          for attempt in $(seq 1 60); do
            if curl -sf http://localhost:8000/api/health >/dev/null && curl -sf -o /dev/null --max-time 60 http://localhost:3000/login && curl -sf -o /dev/null --max-time 60 http://localhost:3100/; then
              exit 0
            fi
            sleep 5
          done
          docker compose logs
          exit 1
      - name: Run smoke scripts
        run: |
          for script in smoke_test smoke_v2 smoke_v2b smoke_release; do
            echo "::group::$script"
            docker compose exec -T backend python -m "scripts.$script"
            echo "::endgroup::"
          done
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --tail 200
      - name: Stop the stack
        if: always()
        run: docker compose down -v
